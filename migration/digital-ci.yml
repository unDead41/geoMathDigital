name: GeoMath Digital checks
on:
  push:
    branches: [main, 'digitalized-*', 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: digital-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: digital/package-lock.json
      - run: python3 tools/check_repository_scope.py
      - name: Portal tests and independent build
        working-directory: digital
        run: |
          npm ci
          npm test
          npm run build
          npm run prepare:pages
          npm run check
