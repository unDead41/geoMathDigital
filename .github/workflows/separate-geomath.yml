name: Separate GeoMath Digital
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separate-geomath.yml'
      - 'migration/split.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geomath-digital-separation
  cancel-in-progress: false
jobs:
  separate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run separation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare filtered Digital source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install git-filter-repo==2.47.0
          python3 migration/split.py prepare digital
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .migration-work/source/digital/package-lock.json
      - name: Verify independent Digital source
        working-directory: .migration-work/source/digital
        run: |
          npm ci
          npm test
          npm run build
          npm run prepare:pages
          npm run check
      - name: Publish verified Digital branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 migration/split.py publish digital
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geomath-digital-separation-receipt
          path: .migration-work/receipt.json
          if-no-files-found: ignore
