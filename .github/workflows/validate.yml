name: GeoMath Digital checks
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: digital-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: digital/package-lock.json
      - run: python3 tools/check_repository_scope.py
      - name: Rebuild and verify portal, learning modules and original media
        working-directory: digital
        run: |
          npm ci
          npm run verify
      - name: Check source stays clean after build
        run: |
          python3 tools/check_repository_scope.py
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: GeoMathDigital-build
          path: |
            digital/artifacts/GeoDecoder_Digital_V2.html
            digital/artifacts/pwa/
          if-no-files-found: error
          retention-days: 14
